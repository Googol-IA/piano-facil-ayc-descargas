<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nueva contraseña — Piano fácil AyC</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  body{font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:#241a3a;background:#f1ecfa;margin:0;line-height:1.5}
  main{max-width:460px;margin:0 auto;padding:32px 20px}
  .card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 8px 24px #5a439022;text-align:center}
  img{width:96px;height:96px;border-radius:22px}
  h1{color:#4a2f8a;font-size:1.5rem;margin:12px 0 4px} p{color:#4b4263}
  input{width:100%;padding:14px;font-size:1rem;border:2px solid #cbbdea;border-radius:14px;margin:6px 0;box-sizing:border-box}
  button{background:#ffd36b;border:0;border-radius:999px;font-weight:900;font-size:1.05rem;padding:14px 28px;margin-top:10px;cursor:pointer;color:#2a1d00}
  .msg{margin-top:14px;font-weight:700} .err{color:#b3261e} .ok{color:#1b6b3a}
</style>
</head>
<body><main><div class="card">
<img src="icono.png" alt="Piano fácil AyC" width="96" height="96">
<h1>Nueva contraseña</h1>
<p>Para tu cuenta de <strong>Piano fácil AyC</strong>.<br>(No afecta a otras aplicaciones.)</p>
<form id="f" hidden>
  <input id="p1" type="password" minlength="8" placeholder="Contraseña nueva (mínimo 8)" autocomplete="new-password" required>
  <input id="p2" type="password" minlength="8" placeholder="Repite la contraseña" autocomplete="new-password" required>
  <button type="submit">Guardar contraseña</button>
</form>
<div id="m" class="msg"></div>
</div></main>
<script>
const URL_BASE='https://wvqdjyzpyiexrefiynec.supabase.co', KEY='sb_publishable_IPAz3pRH8mIySdDval6vNA_JLFi6rQA';
const q=new URLSearchParams(location.hash.slice(1));
const token=q.get('access_token'), m=document.getElementById('m'), f=document.getElementById('f');
history.replaceState(null,'',location.pathname);
if(token && q.get('type')==='recovery'){ f.hidden=false; }
else { m.className='msg err'; m.textContent='El enlace no es válido o ha caducado. Vuelve a la app y pide otro con «¿Has olvidado la contraseña?».'; }
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const a=document.getElementById('p1').value, b=document.getElementById('p2').value;
  m.className='msg';
  if(a!==b){m.className='msg err';m.textContent='Las dos contraseñas no coinciden.';return;}
  try{
    const r=await fetch(URL_BASE+'/auth/v1/user',{method:'PUT',headers:{'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:a})});
    if(r.ok){f.hidden=true;m.className='msg ok';m.textContent='¡Listo! Ya puedes entrar en la app de Piano fácil AyC con la contraseña nueva.';}
    else{const j=await r.json().catch(()=>({}));m.className='msg err';m.textContent=(j.msg||j.message||'No se pudo guardar.')+' Si el enlace caducó, pide otro desde la app.';}
  }catch(_){m.className='msg err';m.textContent='Sin conexión. Inténtalo de nuevo.';}
});
</script></body></html>
